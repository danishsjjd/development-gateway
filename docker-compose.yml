services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    image: development-gateway-caddy:2.11.4-security1
    container_name: caddy
    hostname: caddy
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=${PUID:-1000},gid=${PGID:-1000}
    security_opt:
      - no-new-privileges:true
    # Proxy requests in Caddy; never route packets between app networks.
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
      net.ipv4.ip_unprivileged_port_start: "0"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    ports:
      - "${TAILSCALE_IP:?set to the server's Tailscale IP}:443:443"
      - "${TAILSCALE_IP:?set to the server's Tailscale IP}:443:443/udp"
    healthcheck:
      test: ["CMD", "/usr/bin/healthcheck", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      # Only the gateway and tunnel belong here. Add app backend networks
      # to Caddy with docker-compose.override.yml (see README).
      caddy_net:
        ipv4_address: 172.18.0.2
    volumes:
      # Directory mount, not a single-file mount: editors save via
      # rename, which would detach a file mount from the new inode.
      - ./caddy:/etc/caddy:ro
      - ./caddy_config:/config
      - ./caddy_data:/data

  cloudflared:
    build:
      context: .
      dockerfile: Dockerfile.cloudflared
    image: development-gateway-cloudflared:2026.9.3-security1
    container_name: cloudflared
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 127.0.0.1:2000 run --token-file /run/secrets/cloudflared-token
    depends_on:
      caddy:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/bin/healthcheck", "http://127.0.0.1:2000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      caddy_net:
        ipv4_address: 172.18.0.3
    volumes:
      - ./.cloudflared.token:/run/secrets/cloudflared-token:ro

networks:
  caddy_net:
    name: caddy_net
    external: true
